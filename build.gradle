plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.addAll(["-Xlint:all,-classfile,-processing,-deprecation,-this-escape", "-Xmaxerrs", "5000"])
	options.encoding = 'UTF-8'
	options.release = 25
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	maven {
		name 'Tama\'s Maven' // Beanification
		url 'https://maven.tamaized.com/releases/'
		content {
			includeGroup("tamaized")
		}
	}
	maven {
		name 'Jared\'s Maven' // JEI
		url 'https://maven.blamejared.com/'
	}
	maven {
		name = "Curios" // Curios
		url = uri("https://maven.theillusivec4.top/")
	}
	maven {
		name 'Shedaniel\'s Maven' //REI
		url "https://maven.shedaniel.me"
	}
	maven {
		name = "TerraformersMC" //EMI
		url = "https://maven.terraformersmc.com/"
		content {
			includeGroup("com.terraformersmc")
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		// forRepositories(fg.repository) // Uncomment when using ForgeGradle
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { // TOP
		url "https://maven.k-4u.nl"
	}
	maven { //CS
		url "https://nexus.resourcefulbees.com/repository/maven-public/"
	}
	maven {
		name 'Curseforge Maven' // Jade
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	mavenCentral()
}

sourceSets {
	main {
		java {
			exclude 'twilightforest/disabled/**'
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
	data {
		compileClasspath += main.compileClasspath + main.output
		java {
			srcDirs = ['src/main/java', 'src/data/java']
			exclude 'twilightforest/disabled/**'
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/twilightforest.accesswidener")

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet sourceSets.data
			//sourceSet sourceSets.test
		}
	}
}

fabricApi {
	configureDataGeneration()
}

tasks.named('runDatagen') {
	dependsOn 'compileDataJava'
	classpath += sourceSets.data.output
}

tasks.named('processDataResources') {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Skip the test task so `build` does not block on running tests
tasks.named('test') {
	enabled = false
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Beanification (dependency injection)
	//implementation "tamaized:beanification:${project.beanification_version}"

	// Forge Config API Port (provides NeoForge-compatible config API)
	//implementation files('libs/forgeconfigapiport/forgeconfigapiport-fabric-26.1.5.jar')
	implementation 'curse.maven:forge-config-api-port-547434:8292030'
	// Transitive dependencies for ForgeConfigAPIPort
	implementation 'com.electronwill.night-config:core:3.8.3'
	implementation 'com.electronwill.night-config:toml:3.8.3'
	//curse.maven
	implementation 'curse.maven:modmenu-308702:8402669'
	// Test dependencies
	testImplementation 'org.junit.jupiter:junit-jupiter:6.0.1'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	exclude ".cache"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	from("LICENSE") {
		rename { "${it}_${project.mod_id}" }
	}
	archiveFileName = "${project.mod_id}.re26-${project.minecraft_version}-${project.mod_version}-fabric.jar"
}

tasks.withType(Jar).configureEach { task ->
	if (task.name == 'remapJar') {
		task.archiveFileName = "${project.mod_id}.re26-${project.minecraft_version}-${project.mod_version}-fabric.jar"
	}
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	archiveFileName = "${project.mod_id}.re26-${project.minecraft_version}-${project.mod_version}-fabric-sources.jar"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here
	}
}
