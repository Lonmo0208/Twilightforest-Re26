name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    if: ${{ !startsWith(github.ref_name, 'no-build/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'src/main/resources/META-INF/accesstransformer.cfg') }}
          path: ~/.gradle

      - name: Restore Project Level Gradle Cache
        uses: actions/cache@v4
        with:
          key: gradleLocal-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'src/main/resources/META-INF/accesstransformer.cfg') }}
          path: .gradle

      - name: Restore build/tmp Cache
        uses: actions/cache@v4
        with:
          key: gradleBuildTmp-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'src/main/resources/META-INF/accesstransformer.cfg') }}
          path: build/tmp

      - name: Build
        run: |
          ./gradlew build -x test --build-cache --max-workers=1 \
            -PCIRevision=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2).${{ github.run_number }} \
            -PCIType=RELEASE
        env:
          GRADLE_OPTS: '-Xmx3072m'

      - name: Upload built JARs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twilightforest-artifacts
          path: build/libs/

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
